<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Adampur Official Cadastral Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin:0; font-family:'Times New Roman', serif; background: #fff; }
        #map { position:absolute; top:0; bottom:0; width:100%; }

        /* Professional Control Panel */
        .panel {
            position:absolute; top:20px; left:20px; background:white; padding:15px;
            border: 2px solid #1f3c88; border-radius:4px; z-index:10; width:300px;
            box-shadow: 5px 5px 0px rgba(31, 60, 136, 0.2);
        }
        .panel h2 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #1f3c88; border-bottom: 1px solid #ccc; }
        .select-box { width:100%; padding:8px; margin-bottom:10px; border:1px solid #333; font-weight: bold; cursor: pointer; }
        .btn-print { width:100%; padding:10px; background:#1f3c88; color:white; border:none; cursor:pointer; font-weight:bold; }

        /* Map Elements */
        .north-arrow {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: white; padding: 5px 10px; border: 2px solid black;
            font-weight: bold; font-size: 20px; text-align: center;
        }
        
        .signature-box {
            position: absolute; bottom: 140px; right: 20px; z-index: 10;
            background: white; padding: 10px; border: 1px solid black;
            font-size: 12px; line-height: 1.4;
        }

        .footer-strip {
            position: absolute; bottom: 0; width: 100%; height: 100px;
            background: white; border-top: 3px double black; z-index: 5;
            display: flex; justify-content: space-around; align-items: center; padding: 10px;
            box-sizing: border-box; font-size: 13px;
        }

        @media print {
            .panel, .mapboxgl-ctrl { display:none !important; }
            #map { height: 80vh !important; border: 2px solid black; }
            .footer-strip { position: fixed; bottom: 0; border-top: 2px solid black; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div class="north-arrow">N<br>↑</div>

<div class="panel">
    <h2>Official Parcel Lookup</h2>
    <select id="parcelSelect" class="select-box" onchange="zoomToParcel(this.value)">
        <option value="">-- Select Khasra No --</option>
    </select>
    <button class="btn-print" onclick="window.print()">PRINT REVENUE MAP</button>
</div>

<div class="signature-box">
    <strong>OFFICIAL VERIFICATION</strong><br>
    Digitally Signed By:<br>
    Selahadin Yasin<br>
    Date: <span id="sigDate"></span><br>
    <div style="margin-top:5px; border-top: 1px solid #000; padding-top:2px;">Registry Seal</div>
</div>

<div class="footer-strip">
    <div><strong>VILLAGE:</strong> ADAMPUR (34)<br><strong>TEHSIL:</strong> ADAMPUR</div>
    <div style="text-align: center;"><strong>MAP REF:</strong> SAJRA-2024-DIGITAL<br><strong>STATUS:</strong> VERIFIED RECORD</div>
    <div><strong>PREPARED BY:</strong> GIS PORTAL<br><strong>ID:</strong> pk.selahadinosma</div>
</div>

<script>
document.getElementById('sigDate').innerText = new Date().toLocaleDateString();

mapboxgl.accessToken = 'pk.eyJ1Ijoic2VsYWhhZGlub3NtYSIsImEiOiJjazN0bWd5MnIwMXpoM2Rxc25vYTh2cWZwIn0.jLJ0WYJz1asf5kJa80iCBg';

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [75.462, 29.261],
    zoom: 15,
    preserveDrawingBuffer: true
});

map.addControl(new mapboxgl.ScaleControl({ maxWidth: 100, unit: 'metric' }));

map.on('load', () => {
    // 1. SET UP INFRASTRUCTURE (ROADS & BUILDINGS)
    // Darken building footprints for "Floor Plan" visibility
    map.addLayer({
        'id': '3d-buildings',
        'source': 'composite',
        'source-layer': 'building',
        'filter': ['==', 'extrude', 'true'],
        'type': 'fill-extrusion',
        'minzoom': 14,
        'paint': {
            'fill-extrusion-color': '#aaa',
            'fill-extrusion-height': ['get', 'height'],
            'fill-extrusion-base': ['get', 'min_height'],
            'fill-extrusion-opacity': 0.6
        }
    });

    // 2. YOUR CADASTRAL DATA SOURCE
    map.addSource('parcels', {
        type: 'vector',
        url: 'mapbox://selahadinosma.39n1a9cd'
    });

    // Main Parcel Styling
    map.addLayer({
        id: 'parcel-fill',
        type: 'fill',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        paint: {
            'fill-color': [
                'case',
                ['boolean', ['feature-state', 'selected'], false], '#ff9800',
                '#ffffff'
            ],
            'fill-opacity': 0.4 // Lowered so roads/buildings show through
        }
    });

    map.addLayer({
        id: 'parcel-outline',
        type: 'line',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        paint: {
            'line-color': '#000',
            'line-width': ['case', ['boolean', ['feature-state', 'selected'], false], 3, 1]
        }
    });

    map.addLayer({
        id: 'parcel-label',
        type: 'symbol',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        layout: {
            'text-field': ['get', 'n_khas_no'],
            'text-size': 11,
            'text-font': ['Open Sans Bold']
        }
    });

    // Populating the list automatically
    map.on('idle', () => {
        const select = document.getElementById('parcelSelect');
        if (select.options.length <= 1) {
            const features = map.querySourceFeatures('parcels', { sourceLayer: 'query-bo3cb9' });
            const uniqueKhasras = [...new Set(features.map(f => f.properties.n_khas_no))].sort();
            uniqueKhasras.forEach(no => {
                if(no) {
                    let opt = document.createElement('option');
                    opt.value = no;
                    opt.innerHTML = "Khasra: " + no;
                    select.appendChild(opt);
                }
            });
        }
    });
});

function zoomToParcel(khasraNo) {
    if (!khasraNo) return;
    const features = map.querySourceFeatures('parcels', { sourceLayer: 'query-bo3cb9' });
    features.forEach(f => {
        map.setFeatureState({ source: 'parcels', sourceLayer: 'query-bo3cb9', id: f.id }, { selected: false });
        if(f.properties.n_khas_no === khasraNo) {
            map.setFeatureState({ source: 'parcels', sourceLayer: 'query-bo3cb9', id: f.id }, { selected: true });
            const bbox = turf.bbox(f);
            map.fitBounds(bbox, { padding: 150 });
        }
    });
}
</script>
</body>
</html>
