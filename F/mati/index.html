<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Adampur Cadastral GIS Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<style>
body { margin:0; font-family:Arial, sans-serif; }
#map { position:absolute; top:0; bottom:0; width:100%; }

.panel {
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
    z-index:2;
    width:300px;
    font-size:13px;
}

.panel input {
    width:100%;
    padding:8px;
    margin-top:6px;
    margin-bottom:10px;
}

.panel button {
    width:100%;
    padding:10px;
    background:#1f3c88;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.title-block {
    position:absolute;
    bottom:0;
    width:100%;
    background:white;
    border-top:2px solid black;
    padding:10px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
}

.signature-block {
    position:absolute;
    bottom:120px;
    right:20px;
    background:white;
    padding:10px;
    border:1px solid black;
    font-size:11px;
}

.north-arrow {
    position:absolute;
    top:20px;
    right:20px;
    background:white;
    padding:6px;
    font-weight:bold;
    border-radius:6px;
}

@media print {
    body * { visibility:hidden; }
    #map, #map * { visibility:visible; }
    #map { position:absolute; left:0; top:0; width:100%; height:85%; }
    .title-block, .signature-block { visibility:visible; }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
<strong>Parcel Search</strong>
<input type="text" id="searchInput" placeholder="Search Khasra / MuKi">
<button onclick="window.print()">Export A4 PDF</button>
</div>

<div class="north-arrow">↑ N</div>

<div class="signature-block">
<strong>Digitally Signed</strong><br>
GIS Land Records Portal<br>
Officer: Selahadin Yasin<br>
Signature ID: <span id="sigID"></span><br>
Date: <span id="sigDate"></span>
</div>

<div class="title-block">
<div>
<strong>Project:</strong> Adampur Cadastral Map<br>
Village: ADAMPUR(34)<br>
District: HISAR
</div>
<div>
Scale: Auto<br>
Prepared By: GIS Portal<br>
Tileset Ref: selahadinosma.39n1a9cd
</div>
</div>

<script>

mapboxgl.accessToken = 'pk.eyJ1Ijoic2VsYWhhZGlub3NtYSIsImEiOiJjazN0bWd5MnIwMXpoM2Rxc25vYTh2cWZwIn0.jLJ0WYJz1asf5kJa80iCBg';

let selectedParcelId = null;
let adjacentIds = [];

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [75.46, 29.26],
    zoom: 14
});

map.addControl(new mapboxgl.NavigationControl());
map.addControl(new mapboxgl.ScaleControl());

map.on('load', () => {

    map.addSource('parcels', {
        type: 'vector',
        url: 'mapbox://selahadinosma.39n1a9cd'
    });

    map.addLayer({
        id: 'parcel-fill',
        type: 'fill',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        paint: {
            'fill-color': '#e6e6e6',
            'fill-opacity': 0.85
        }
    });

    map.addLayer({
        id: 'parcel-outline',
        type: 'line',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        paint: {
            'line-color': '#333',
            'line-width': 1.2
        }
    });

    map.addLayer({
        id: 'parcel-label',
        type: 'symbol',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        layout: {
            'text-field': ['get','n_khas_no'],
            'text-size': 12,
            'text-font': ['Open Sans Bold']
        },
        paint: {
            'text-color': '#111'
        }
    });

    map.on('click', 'parcel-fill', (e) => {

        const feature = e.features[0];
        selectedParcelId = feature.properties.OBJECTID;
        adjacentIds = [];

        const features = map.queryRenderedFeatures({
            layers: ['parcel-fill']
        });

        const selectedGeom = feature.geometry;

        features.forEach(f => {
            if (f.properties.OBJECTID !== selectedParcelId) {
                if (isAdjacent(selectedGeom, f.geometry)) {
                    adjacentIds.push(f.properties.OBJECTID);
                }
            }
        });

        updateStyles();

        const p = feature.properties;
        new mapboxgl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(
            "<b>Khasra:</b> " + p.n_khas_no + "<br>" +
            "<b>MuKi:</b> " + p.mu_ki + "<br>" +
            "<b>Murraba:</b> " + p.n_murr_no + "<br>" +
            "<b>Area:</b> " + p.kanal + " Kanal " + p.marla + " Marla<br>" +
            "<b>Status:</b> " + p.remarks
        )
        .addTo(map);
    });

    document.getElementById('searchInput')
    .addEventListener('keyup', function() {
        const val = this.value.toLowerCase();

        map.setFilter('parcel-fill', [
            'any',
            ['in', val, ['downcase', ['get','n_khas_no']]],
            ['in', val, ['downcase', ['get','mu_ki']]]
        ]);

        map.setFilter('parcel-outline', [
            'any',
            ['in', val, ['downcase', ['get','n_khas_no']]],
            ['in', val, ['downcase', ['get','mu_ki']]]
        ]);
    });

});

function updateStyles() {
    map.setPaintProperty('parcel-fill', 'fill-color', [
        'case',
        ['==', ['get','OBJECTID'], selectedParcelId], '#d7191c',
        ['in', ['get','OBJECTID'], ['literal', adjacentIds]], '#fdae61',
        '#e6e6e6'
    ]);
}

function isAdjacent(geom1, geom2) {
    const coords1 = geom1.coordinates[0];
    const coords2 = geom2.coordinates[0];

    for (let i = 0; i < coords1.length; i++) {
        for (let j = 0; j < coords2.length; j++) {
            if (
                coords1[i][0] === coords2[j][0] &&
                coords1[i][1] === coords2[j][1]
            ) {
                return true;
            }
        }
    }
    return false;
}

function generateSignature() {
    const random = Math.random().toString(36).substring(2,10).toUpperCase();
    const timestamp = Date.now().toString().slice(-6);
    return "ADP-" + random + "-" + timestamp;
}

document.getElementById("sigID").innerText = generateSignature();
document.getElementById("sigDate").innerText =
    new Date().toLocaleString();

</script>

</body>
</html>
