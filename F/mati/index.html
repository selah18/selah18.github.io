<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Professional Cadastral Floor Map</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<style>
body { margin:0; padding:0; background:white; font-family:Arial; }
#map { position:absolute; top:0; bottom:0; width:100%; }

.a4-border{
    position:absolute;
    top:20px;
    bottom:20px;
    left:20px;
    right:20px;
    border:3px solid black;
    pointer-events:none;
}

.title-box{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    font-weight:bold;
    font-size:18px;
}

.signature{
    position:absolute;
    bottom:40px;
    right:50px;
    font-size:12px;
}

.north-arrow{
    position:absolute;
    top:80px;
    right:40px;
    font-size:24px;
    font-weight:bold;
}

@media print{
    .no-print{ display:none; }
}
</style>
</head>

<body>

<div id="map"></div>
<div class="a4-border"></div>
<div class="title-box">ADAMPUR CADASTRAL FLOOR MAP</div>
<div class="north-arrow">N ↑</div>

<div class="signature">
    GIS Officer<br>
    Digital Signature: Auto Verified<br>
    Date: <span id="date"></span>
</div>

<script>

document.getElementById("date").innerHTML =
new Date().toLocaleDateString();

mapboxgl.accessToken = 'pk.eyJ1Ijoic2VsYWhhZGlub3NtYSIsImEiOiJjazN0bWd5MnIwMXpoM2Rxc25vYTh2cWZwIn0.jLJ0WYJz1asf5kJa80iCBg';

let selectedId = null;
let adjacentIds = [];

const map = new mapboxgl.Map({
    container: 'map',
    style: {
        version: 8,
        sources: {},
        layers: []
    },
    center: [75.46,29.26],
    zoom: 16
});

map.addControl(new mapboxgl.ScaleControl({maxWidth:150, unit:'metric'}));

map.on('load', () => {

    map.addSource('parcels', {
        type: 'vector',
        url: 'mapbox://selahadinosma.39n1a9cd'
    });

    map.addLayer({
        id: 'parcel-fill',
        type: 'fill',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        paint: {
            'fill-color': '#eeeeee',
            'fill-opacity': 1
        }
    });

    map.addLayer({
        id: 'parcel-outline',
        type: 'line',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        paint: {
            'line-color': '#000000',
            'line-width': 2.5
        }
    });

    map.addLayer({
        id: 'parcel-label',
        type: 'symbol',
        source: 'parcels',
        'source-layer': 'query-bo3cb9',
        layout: {
            'text-field': ['get','n_khas_no'],
            'text-size': 14,
            'text-font': ['Open Sans Bold'],
            'text-anchor': 'center'
        },
        paint: {
            'text-color': '#000'
        }
    });

    map.on('click','parcel-fill',(e)=>{

        const feature = e.features[0];
        selectedId = feature.properties.OBJECTID;
        adjacentIds = [];

        const features = map.queryRenderedFeatures({
            layers:['parcel-fill']
        });

        const geom = feature.geometry;

        features.forEach(f=>{
            if(f.properties.OBJECTID !== selectedId){
                if(isAdjacent(geom,f.geometry)){
                    adjacentIds.push(f.properties.OBJECTID);
                }
            }
        });

        updateColors();

        map.fitBounds(turf.bbox(feature),{
            padding:100,
            maxZoom:18
        });

    });

});

function updateColors(){

    map.setPaintProperty('parcel-fill','fill-color',[
        'case',
        ['==',['get','OBJECTID'],selectedId],'#ff0000',
        ['in',['get','OBJECTID'],['literal',adjacentIds]],'#ffcc80',
        '#eeeeee'
    ]);

}

function isAdjacent(g1,g2){
    const c1 = g1.coordinates[0];
    const c2 = g2.coordinates[0];

    for(let i=0;i<c1.length;i++){
        for(let j=0;j<c2.length;j++){
            if(c1[i][0]===c2[j][0] &&
               c1[i][1]===c2[j][1]){
                return true;
            }
        }
    }
    return false;
}

</script>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

</body>
</html>
