<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Adampur Land Portal - Search Fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body { margin:0; font-family: 'Segoe UI', sans-serif; }
  #map { position:absolute; top:0; bottom:0; width:100%; }
  #panel { position:absolute; top:15px; left:15px; z-index:3; background:white; padding:20px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.2); width:320px; }
  input, select, button { width:100%; padding:10px; margin-top:8px; border-radius:8px; border:1px solid #ccc; box-sizing: border-box; }
  button { background:#1a73e8; color:white; font-weight:bold; cursor:pointer; border:none; }
  #suggestions { background:white; max-height:200px; overflow-y:auto; border:1px solid #ddd; margin-top:5px; border-radius:8px; display:none; }
  .suggestion-item { padding:12px; cursor:pointer; border-bottom:1px solid #eee; font-size:13px; }
  .suggestion-item:hover { background:#f1f3f4; }
  .status-msg { font-size:11px; color:#d93025; margin-top:5px; font-weight:bold; }
</style>
</head>
<body>

<div id="panel">
  <h3 style="margin:0 0 10px 0; color:#1a73e8;">Adampur Land Portal</h3>
  
  <button onclick="zoomToAdampur()">📍 1. CLICK TO LOAD DATA</button>
  <div id="zoomWarning" class="status-msg" style="display:none;">⚠️ Please click the button above first!</div>

  <select id="searchType" style="margin-top:15px;">
    <option value="n_khas_no">Search Khasra No.</option>
    <option value="mu_ki">Search Owner Name</option>
  </select>
  <input type="text" id="searchInput" placeholder="Type number here...">
  <div id="suggestions"></div>

  <button onclick="downloadPDF()" style="margin-top:20px; background:#34a853;">⬇️ 2. Download PDF</button>
</div>

<div id="map"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1Ijoic2VsYWhhZGlub3NtYSIsImEiOiJjazN0bWd5MnIwMXpoM2Rxc25vYTh2cWZwIn0.jLJ0WYJz1asf5kJa80iCBg';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [75.5045, 29.2616],
  zoom: 12,
  preserveDrawingBuffer: true
});

const LAYER_ID = 'adampur_parcels_wgs8-5tkgpu';

map.on('load', () => {
  map.addSource('parcels-src', {
    type: 'vector',
    url: 'mapbox://selahadinosma.46aakx24'
  });

  map.addLayer({
    id: 'parcels-layer',
    type: 'fill',
    source: 'parcels-src',
    'source-layer': LAYER_ID,
    paint: { 'fill-color': '#1a73e8', 'fill-opacity': 0.2 }
  });
});

function zoomToAdampur() {
  map.flyTo({ center: [75.5045, 29.2616], zoom: 17 });
  document.getElementById('zoomWarning').style.display = 'none';
}

const searchInput = document.getElementById('searchInput');
const suggestions = document.getElementById('suggestions');

searchInput.addEventListener('input', () => {
  const val = searchInput.value.trim().toLowerCase();
  const zoom = map.getZoom();

  // If user isn't zoomed in, the data won't exist in the browser yet
  if (zoom < 14) {
    document.getElementById('zoomWarning').style.display = 'block';
    suggestions.style.display = 'none';
    return;
  }

  if (val.length < 1) {
    suggestions.style.display = 'none';
    return;
  }

  // Find features in the currently loaded tiles
  const features = map.queryRenderedFeatures({ layers: ['parcels-layer'] });
  const type = document.getElementById('searchType').value;
  
  // Use a Map to keep unique Khasra numbers
  const uniqueMatches = new Map();

  features.forEach(f => {
    const propValue = f.properties[type]?.toString().toLowerCase() || "";
    if (propValue.includes(val)) {
      uniqueMatches.set(f.properties.n_khas_no, f);
    }
  });

  if (uniqueMatches.size > 0) {
    suggestions.innerHTML = '';
    suggestions.style.display = 'block';
    
    uniqueMatches.forEach((f, khasra) => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.innerHTML = `<strong>Khasra: ${khasra}</strong><br><small>Owner: ${f.properties.mu_ki || 'N/A'}</small>`;
      item.onclick = () => {
        selectParcel(f);
        searchInput.value = khasra;
        suggestions.style.display = 'none';
      };
      suggestions.appendChild(item);
    });
  } else {
    suggestions.innerHTML = '<div class="suggestion-item">No results. Try moving the map slightly.</div>';
    suggestions.style.display = 'block';
  }
});

let selectedFeature = null;

function selectParcel(f) {
  selectedFeature = f;
  
  if (map.getLayer('highlight')) map.removeLayer('highlight');
  if (map.getSource('highlight-src')) map.removeSource('highlight-src');

  map.addSource('highlight-src', { type: 'geojson', data: f });
  map.addLayer({
    id: 'highlight',
    type: 'line',
    source: 'highlight-src',
    paint: { 'line-color': '#ff0000', 'line-width': 3 }
  });

  const bbox = turf.bbox(f);
  map.fitBounds(bbox, { padding: 80 });
}

function downloadPDF() {
  if (!selectedFeature) {
    alert("Dropdown selection required! Type a Khasra number, then click the result from the list.");
    return;
  }
  const doc = new window.jspdf.jsPDF();
  const p = selectedFeature.properties;
  
  doc.text("ADAMPUR LAND RECORD", 105, 20, { align: 'center' });
  doc.text(`Khasra: ${p.n_khas_no} | Owner: ${p.mu_ki}`, 20, 40);
  
  map.once('idle', () => {
    const imgData = map.getCanvas().toDataURL('image/png');
    doc.addImage(imgData, 'PNG', 15, 50, 180, 110);
    doc.save(`Parcel_${p.n_khas_no}.pdf`);
  });
  map.setBearing(map.getBearing());
}
</script>
</body>
</html>
