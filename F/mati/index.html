<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Adampur Land Portal - Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body { margin:0; font-family: 'Segoe UI', Tahoma, sans-serif; background:#f0f2f5; }
  #map { position:absolute; top:0; bottom:0; width:100%; }
  #panel { position:absolute; top:15px; left:15px; z-index:3; background:white; padding:20px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.15); width:320px; }
  h3 { margin:0 0 15px 0; color: #1a73e8; border-bottom: 2px solid #f1f3f4; padding-bottom: 10px; }
  input, select, button { width:100%; padding:10px; margin-top:8px; border-radius:8px; border:1px solid #dadce0; box-sizing: border-box; font-size: 14px; }
  button { background:#1a73e8; color:white; font-weight:600; cursor:pointer; border:none; transition: background 0.2s; }
  button:hover { background:#1557b0; }
  .secondary { background:#5f6368; }
  .secondary:hover { background:#3c4043; }
  #suggestions { background:white; max-height:180px; overflow-y:auto; border:1px solid #dadce0; display:none; margin-top:5px; border-radius:8px; }
  .suggestion-item { padding:12px; cursor:pointer; border-bottom:1px solid #f1f3f4; }
  .suggestion-item:hover { background:#f8f9fa; }
  .tool-box { margin-top:12px; padding:12px; background:#e8f0fe; border-radius:8px; display:none; font-size:13px; color: #1967d2; }
</style>
</head>
<body>

<div id="panel">
  <h3>Adampur Land Portal</h3>
  
  <button onclick="zoomToAdampur()">📍 Zoom to Adampur</button>
  
  <select id="searchType">
    <option value="n_khas_no">Search Khasra No.</option>
    <option value="mu_ki">Search Owner Name</option>
  </select>
  <input type="text" id="searchInput" placeholder="Search parcels...">
  <div id="suggestions"></div>

  <button onclick="downloadPDF()" style="margin-top:15px;">⬇️ Download PDF Certificate</button>
  <button class="secondary" onclick="toggleSatellite()">🛰️ Toggle Satellite</button>
  <button id="measureBtn" class="secondary" onclick="toggleMeasureTool()">📐 Measurement Tools: OFF</button>
  
  <div id="measureBox" class="tool-box">
    <strong>Measurements:</strong><br>
    📏 Distance: <span id="distVal">0</span>m<br>
    🌍 Area: <span id="areaVal">0</span> m²
    <div style="font-size:11px; margin-top:5px; opacity:0.8;">Click map to draw. Minimum 3 points for area.</div>
    <button onclick="clearMeasurements()" style="padding:5px; font-size:11px; margin-top:8px; background:#d93025;">🗑️ Clear</button>
  </div>
</div>

<div id="map"></div>

<script>
const ACCESS_TOKEN = 'pk.eyJ1Ijoic2VsYWhhZGlub3NtYSIsImEiOiJjazN0bWd5MnIwMXpoM2Rxc25vYTh2cWZwIn0.jLJ0WYJz1asf5kJa80iCBg';
const TILESET_ID = 'selahadinosma.46aakx24';
const LAYER_NAME = 'adampur_parcels_wgs8-5tkgpu';

mapboxgl.accessToken = ACCESS_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [75.5045, 29.2616],
  zoom: 12,
  preserveDrawingBuffer: true,
  antialias: true
});

let selectedFeature = null;
let measurePoints = [];
let isToolActive = false;

map.on('load', () => {
  setupDataLayers();
});

function setupDataLayers() {
  if (!map.getSource('parcels')) {
    map.addSource('parcels', { type: 'vector', url: `mapbox://${TILESET_ID}` });
  }

  map.addLayer({
    id: 'parcel-fills',
    type: 'fill',
    source: 'parcels',
    'source-layer': LAYER_NAME,
    paint: { 'fill-color': '#1a73e8', 'fill-opacity': 0.15 }
  });

  map.addLayer({
    id: 'parcel-lines',
    type: 'line',
    source: 'parcels',
    'source-layer': LAYER_NAME,
    paint: { 'line-color': '#5f6368', 'line-width': 0.5 }
  });

  // Measurement Layers
  map.addSource('measure-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'measure-poly',
    type: 'fill',
    source: 'measure-src',
    paint: { 'fill-color': '#1a73e8', 'fill-opacity': 0.3 }
  });
  map.addLayer({
    id: 'measure-line',
    type: 'line',
    source: 'measure-src',
    paint: { 'line-color': '#1a73e8', 'line-width': 2, 'line-dasharray': [2, 1] }
  });
}

function zoomToAdampur() {
  map.flyTo({ center: [75.5045, 29.2616], zoom: 17, pitch: 45 });
}

// SEARCH
const searchInput = document.getElementById('searchInput');
const suggestions = document.getElementById('suggestions');

searchInput.addEventListener('input', () => {
  const val = searchInput.value.trim().toLowerCase();
  if (val.length < 1) { suggestions.style.display = 'none'; return; }

  const features = map.queryRenderedFeatures({ layers: ['parcel-fills'] });
  const type = document.getElementById('searchType').value;
  
  const matches = features.filter(f => 
    f.properties[type]?.toString().toLowerCase().includes(val)
  );

  const unique = Array.from(new Set(matches.map(a => a.properties.n_khas_no)))
    .map(id => matches.find(a => a.properties.n_khas_no === id));

  if (unique.length > 0) {
    suggestions.innerHTML = '';
    suggestions.style.display = 'block';
    unique.slice(0, 8).forEach(f => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.innerHTML = `<strong>Khasra ${f.properties.n_khas_no}</strong><br><small>${f.properties.mu_ki || ''}</small>`;
      item.onclick = () => {
        selectParcel(f);
        suggestions.style.display = 'none';
        searchInput.value = f.properties.n_khas_no;
      };
      suggestions.appendChild(item);
    });
  }
});

function selectParcel(f) {
  selectedFeature = f;
  const bbox = turf.bbox(f);
  map.fitBounds(bbox, { padding: 60, pitch: 50 });

  if (map.getLayer('highlight-poly')) map.removeLayer('highlight-poly');
  if (map.getSource('highlight-src')) map.removeSource('highlight-src');

  map.addSource('highlight-src', { type: 'geojson', data: f });
  map.addLayer({
    id: 'highlight-poly',
    type: 'fill-extrusion',
    source: 'highlight-src',
    paint: {
      'fill-extrusion-color': '#d93025',
      'fill-extrusion-height': 2,
      'fill-extrusion-opacity': 0.8
    }
  });
}

// MEASUREMENT TOOLS
function toggleMeasureTool() {
  isToolActive = !isToolActive;
  const btn = document.getElementById('measureBtn');
  const box = document.getElementById('measureBox');
  btn.innerText = isToolActive ? "📐 Tools: ON" : "📐 Measurement Tools: OFF";
  box.style.display = isToolActive ? "block" : "none";
  if (!isToolActive) clearMeasurements();
}

function clearMeasurements() {
  measurePoints = [];
  map.getSource('measure-src').setData({ type: 'FeatureCollection', features: [] });
  document.getElementById('distVal').innerText = "0";
  document.getElementById('areaVal').innerText = "0";
}

map.on('click', (e) => {
  if (!isToolActive) return;
  measurePoints.push([e.lngLat.lng, e.lngLat.lat]);

  const features = [{
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: measurePoints }
  }];

  if (measurePoints.length >= 3) {
    features.push({
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [[...measurePoints, measurePoints[0]]] }
    });
    const area = turf.area(features[1]);
    document.getElementById('areaVal').innerText = area.toFixed(2);
  }

  if (measurePoints.length > 1) {
    const dist = turf.length(features[0], { units: 'meters' });
    document.getElementById('distVal').innerText = dist.toFixed(2);
  }

  map.getSource('measure-src').setData({ type: 'FeatureCollection', features: features });
});

// PDF EXPORT
function downloadPDF() {
  if (!selectedFeature) return alert("Please select a parcel first!");
  const doc = new window.jspdf.jsPDF();
  const p = selectedFeature.properties;
  
  doc.setFontSize(20); doc.setTextColor(26, 115, 232);
  doc.text("ADAMPUR LAND CERTIFICATE", 105, 20, { align: 'center' });
  
  doc.setFontSize(11); doc.setTextColor(0,0,0);
  doc.text(`Khasra Number: ${p.n_khas_no}`, 20, 40);
  doc.text(`Recorded Owner: ${p.mu_ki || 'N/A'}`, 20, 48);
  doc.text(`Village Name: ${p.n_v_name || 'Adampur'}`, 110, 40);
  doc.text(`Total Area: ${p.kanal || 0}K - ${p.marla || 0}M`, 110, 48);

  map.once('idle', () => {
    const imgData = map.getCanvas().toDataURL('image/png');
    doc.addImage(imgData, 'PNG', 15, 60, 180, 110);
    doc.setFontSize(8); doc.setTextColor(150);
    doc.text("Generated via Adampur Land Portal. For informational use only.", 105, 185, { align: 'center' });
    doc.save(`Record_${p.n_khas_no}.pdf`);
  });
  map.setBearing(map.getBearing());
}

function toggleSatellite() {
  const isSat = map.getStyle().sprite.includes('satellite');
  map.setStyle(isSat ? 'mapbox://styles/mapbox/light-v11' : 'mapbox://styles/mapbox/satellite-streets-v12');
  map.once('style.load', () => {
    setupDataLayers();
    if (selectedFeature) selectParcel(selectedFeature);
  });
}
</script>
</body>
</html>
