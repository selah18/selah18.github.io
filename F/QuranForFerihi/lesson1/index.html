<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d111c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Quran Reading">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-180.png">
<title>Learn Arabic → Quran Reading</title>
<style>
:root{--bg:#0d111c;--p:#151b29;--p2:#1d2536;--ink:#f4f5f7;--muted:#929db4;--gold:#e9a72f;--line:#293247;--ok:#61d095;--bad:#ff7070}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;padding-bottom:50px}header{text-align:center;padding:26px 15px 20px;border-bottom:1px solid var(--line)}.kicker{font:12px ui-monospace,monospace;letter-spacing:3px;color:var(--gold)}h1{font-size:32px;margin:13px 0 8px}.sub{color:var(--muted);line-height:1.55;max-width:700px;margin:auto}.actions,.tabs,.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.actions{margin-top:17px}.btn{border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}.gold{background:#211a0d;border-color:var(--gold);color:#ffc95a}.lang{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:16px}.lang button{border:0;background:var(--p);color:var(--muted);padding:9px 18px;cursor:pointer}.lang button.active{background:var(--gold);color:#211a0d;font-weight:700}.voice{margin:12px auto 0;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px;max-width:720px}.install{display:none;color:var(--muted);line-height:1.55;margin:12px auto 0;max-width:700px}.install.show{display:block}.tabs{position:sticky;top:0;background:rgba(13,17,28,.97);padding:13px 10px;z-index:5;border-bottom:1px solid var(--line)}.tab.active{border-color:var(--gold);color:#ffc95a;background:#211a0d}.view{display:none;padding:18px 15px}.view.active{display:block}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;direction:rtl}.big{font-size:60px;text-align:center;line-height:1.4}.tile{text-align:center;background:var(--p2);border:1px solid var(--line);border-radius:13px;padding:14px}.tile .ar{font-size:47px}.muted,.meaning,.note{color:var(--muted)}.note{font-size:12px;line-height:1.5}.syllables{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl;margin:13px 0}.syl{font-size:28px;padding:7px 12px;background:var(--p2);border:1px solid #344057;border-radius:9px;font-family:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif}.word{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.flash{min-height:205px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;cursor:pointer}.flash .ar{font-size:54px}.answer{display:none}.flash.revealed .prompt{display:none}.flash.revealed .answer{display:block}.quiz{max-width:680px;margin:auto;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.choice{padding:14px;border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:10px;cursor:pointer}.correct{border-color:var(--ok)!important;color:var(--ok)}.wrong{border-color:var(--bad)!important;color:var(--bad)}.score{font-size:27px;color:#ffc95a;margin:10px}footer{text-align:center;color:var(--muted);font:11px ui-monospace,monospace;padding:20px}[dir=rtl] .sub,[dir=rtl] .note,[dir=rtl] .meaning{line-height:1.8}@media(max-width:600px){h1{font-size:27px}.big{font-size:53px}.choices{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<header>
<div class="kicker" data-en="GATE A28 · READING PRACTICE" data-am="GATE A28 · የንባብ ልምምድ"></div>
<h1 data-en="LEARN ARABIC → QURAN" data-am="ዓረብኛ → ቁርአን ንባብ"></h1>
<p class="sub" data-en="Start with harakat, read syllables, then practice common Quranic words. Hear each item slowly, use flashcards, and test yourself." data-am="በሐረካት ይጀምሩ፣ ፊደላትን በድምፅ ይያያዙ፣ ከዚያ የቁርአን ቃላትን ይለማመዱ። እያንዳንዱን ቃል በቀስታ ያዳምጡ፣ ፍላሽካርድ እና ፈተና ይጠቀሙ።"></p>
<div class="lang"><button id="enBtn" class="active">EN</button><button id="amBtn">አማ</button></div>
<div class="actions"><button class="btn gold" id="alphabet"></button><button class="btn" id="voiceHelp"></button><button class="btn" id="install"></button></div>
<div class="voice" id="status"></div><div class="install" id="help"></div>
</header>
<nav class="tabs"><button class="btn tab active" data-v="learn"></button><button class="btn tab" data-v="flash"></button><button class="btn tab" data-v="quiz"></button></nav>
<main>
<section id="learn" class="view active">
<div class="card"><h2 data-en="1 · Harakat" data-am="1 · ሐረካት"></h2><p class="muted" data-en="Learn fatha, kasra, damma, sukun and shadda." data-am="ፈትሐ፣ ከስራ፣ ደማ፣ ሱኩን እና ሸዳን ይማሩ።"></p><div id="harakat" class="grid"></div></div>
<div class="card"><h2 data-en="2 · Syllables" data-am="2 · የድምፅ ክፍሎች"></h2><p class="muted" data-en="Read the small units from right to left." data-am="ትንንሽ የንባብ ክፍሎችን ከቀኝ ወደ ግራ ያንብቡ።"></p><div id="syllable"></div></div>
<div class="card"><h2 data-en="3 · Quran reading words" data-am="3 · የቁርአን ንባብ ቃላት"></h2><p class="muted" data-en="Syllable boxes are a beginner reading aid; they do not replace tajweed instruction." data-am="የድምፅ ክፍል ሳጥኖች ለጀማሪዎች የንባብ ረዳት ናቸው፤ የተጅዊድ ትምህርትን አይተኩም።"></p><div id="words"></div></div>
</section>
<section id="flash" class="view"><div class="card"><h2 data-en="Practice flashcards" data-am="የፍላሽካርድ ልምምድ"></h2><p class="muted" data-en="Tap a card to reveal its reading and meaning." data-am="ካርዱን ይንኩ እና ንባቡን እና ትርጉሙን ይመልከቱ።"></p><div class="controls"><button class="btn gold" id="shuffle"></button><button class="btn" id="hearCurrent"></button></div></div><div id="flashGrid" class="grid"></div></section>
<section id="quiz" class="view"><div class="card quiz"><div class="kicker" data-en="READING CHECK" data-am="የንባብ ሙከራ"></div><h2 data-en="Which reading is correct?" data-am="ትክክለኛው ንባብ የትኛው ነው?"></h2><div id="qAr" class="big ar">بَ</div><button class="btn gold" id="qHear"></button><div id="choices" class="choices"></div><div id="score" class="score">0 / 0</div><button class="btn" id="next"></button><p id="feedback" class="muted"></p></div></section>
</main><footer data-en="Offline-first · pronunciation uses the Arabic voice installed on the device." data-am="ከመጀመሪያው የኦፍላይን ሥራ · ድምፅ በመሣሪያው ላይ የተጫነውን የዓረብኛ ድምፅ ይጠቀማል።"></footer></div>
<script>
let lang='en';
const UI={en:{alphabet:'🔊 Arabic alphabet',voice:'🗣️ Arabic voice',install:'📲 Add to Home Screen',learn:'Learn',flash:'Flashcards',quiz:'Quiz',shuffle:'🔀 Shuffle',hear:'🔊 Hear',slow:'🔊 Slow',next:'Next syllable',check:'Checking for an Arabic device voice…',help:`<b>iPhone:</b> Settings → Accessibility → Spoken Content → Voices → Arabic → download a voice.<br>Then return here. For installation, open this page in Safari → Share → Add to Home Screen → Add.`,voiceok:'✓ Arabic voice available: <b>{name}</b> · pronunciation works offline after the voice is downloaded.',voiceno:'⚠️ No Arabic voice detected. Install Arabic under Settings → Accessibility → Spoken Content → Voices.',reveal:'Tap to reveal',correct:'✓ Correct — now say it aloud.',wrong:'Not quite. The answer is ',read:'Read',meaning:'Meaning'},am:{alphabet:'🔊 የዓረብኛ ፊደላት',voice:'🗣️ የዓረብኛ ድምፅ',install:'📲 ወደ Home Screen ጨምር',learn:'ተማር',flash:'ፍላሽካርዶች',quiz:'ፈተና',shuffle:'🔀 ቀላቅል',hear:'🔊 አዳምጥ',slow:'🔊 በቀስታ አዳምጥ',next:'ቀጣይ ድምፅ ክፍል',check:'የዓረብኛ የመሣሪያ ድምፅ በመፈተሽ ላይ…',help:`<b>iPhone:</b> Settings → Accessibility → Spoken Content → Voices → Arabic → የዓረብኛ ድምፅ ያውርዱ።<br>ከዚያ ወደዚህ ይመለሱ። ለመጫን Safari ይክፈቱ → Share → Add to Home Screen → Add።`,voiceok:'✓ የዓረብኛ ድምፅ አለ፡ <b>{name}</b> · ድምፁ ከተወረደ በኋላ ኦፍላይን ይሰራል።',voiceno:'⚠️ የዓረብኛ ድምፅ አልተገኘም። Settings → Accessibility → Spoken Content → Voices ውስጥ Arabic ያውርዱ።',reveal:'ካርዱን ይንኩ ለመግለጥ',correct:'✓ ትክክል — አሁን በድምፅ ይናገሩት።',wrong:'አይደለም። መልሱ ',read:'ንባብ',meaning:'ትርጉም'}};
const H=[['بَ','Fatha','ፈትሐ','ba','አ'],['بِ','Kasra','ከስራ','bi','ኢ'],['بُ','Damma','ደማ','bu','ኡ'],['بْ','Sukun','ሱኩን','b','ድምፅ አልባ'],['بّ','Shadda','ሸዳ','bb','የተደገመ ድምፅ']];
const S=[['مَ','ma','ማ'],['مِ','mi','ሚ'],['مُ','mu','ሙ'],['لَ','la','ላ'],['لِ','li','ሊ'],['لُ','lu','ሉ'],['رَ','ra','ራ'],['رِ','ri','ሪ'],['رُ','ru','ሩ'],['بَ','ba','ባ'],['بِ','bi','ቢ'],['بُ','bu','ቡ']];
const W=[
['رَبِّ',['رَ','بِّ'],'rab-bi','ጌታዬ / ጌታ','Common Quranic word'],['قُلْ',['قُلْ'],'qul','በል','Quranic command'],['هُوَ',['هُ','وَ'],'hu-wa','እርሱ','Common Quranic word'],['اللَّهُ',['اللَّهُ'],'al-laa-hu','አላህ','Divine name'],['الْحَمْدُ',['الْ','حَمْ','دُ'],'al-ham-du','ምስጋና','Quran 1:2'],['الرَّحْمَٰنِ',['الرَّحْ','مَٰ','نِ'],'ar-rah-maa-ni','እጅግ ርኅሩኅ','Quranic name'],['الرَّحِيمِ',['الرَّ','حِي','مِ'],'ar-ra-hee-mi','በጣም አዛኝ','Quranic name'],['كِتَابٌ',['كِ','تَا','بٌ'],'ki-taa-bun','መጽሐፍ','Quranic vocabulary'],['نُورٌ',['نُو','رٌ'],'nuu-run','ብርሃን','Quranic vocabulary'],['قَلْبٌ',['قَلْ','بٌ'],'qal-bun','ልብ','Quranic vocabulary'],['سَمَاءٌ',['سَ','مَا','ءٌ'],'sa-maa-un','ሰማይ','Quranic vocabulary'],['أَرْضٌ',['أَرْ','ضٌ'],'ar-dun','ምድር','Quranic vocabulary']];
function T(){return UI[lang]}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir='ltr';document.querySelectorAll('[data-en]').forEach(e=>e.innerHTML=e.getAttribute('data-'+lang));enBtn.classList.toggle('active',lang==='en');amBtn.classList.toggle('active',lang==='am');alphabet.textContent=T().alphabet;voiceHelp.textContent=T().voice;install.textContent=T().install;document.querySelectorAll('.tab')[0].textContent=T().learn;document.querySelectorAll('.tab')[1].textContent=T().flash;document.querySelectorAll('.tab')[2].textContent=T().quiz;shuffle.textContent=T().shuffle;hearCurrent.textContent=T().hear;qHear.textContent=T().hear;next.textContent=T().next;status.innerHTML=T().check;help.innerHTML=T().help;renderHarakat();renderSyllable();renderWords();renderFlash();makeQuiz();checkVoice()}
function speak(t,r=.58){if(!('speechSynthesis'in window)){alert('Speech is not available in this browser.');return}let vs=speechSynthesis.getVoices(),v=vs.find(x=>/^ar([_-]|$)/i.test(x.lang));if(!v){status.innerHTML=T().voiceno;return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=r;u.pitch=1;speechSynthesis.speak(u)}
function checkVoice(){let vs=speechSynthesis?.getVoices?.()||[],v=vs.find(x=>/^ar([_-]|$)/i.test(x.lang));status.innerHTML=v?T().voiceok.replace('{name}',v.name):T().voiceno}
function renderHarakat(){harakat.innerHTML=H.map(x=>`<div class="tile"><div class="ar">${x[0]}</div><b>${lang==='en'?x[1]:x[2]}</b><div class="note">${x[3]} · ${x[4]}</div><button class="btn gold" onclick="speak('${x[0]}',.5)">${T().hear}</button></div>`).join('')}
function renderSyllable(){let x=S[Math.floor(Math.random()*S.length)];syllable.innerHTML=`<div class="big ar">${x[0]}</div><div class="meaning"><b>${x[1]}</b> · ${x[2]}</div><div class="controls"><button class="btn gold" onclick="speak('${x[0]}',.5)">${T().slow}</button><button class="btn" onclick="renderSyllable()">${T().next}</button></div>`}
function renderWords(){words.innerHTML=W.map(x=>`<div class="word"><div class="big ar">${x[0]}</div><div class="syllables">${x[1].map(p=>`<span class="syl">${p}</span>`).join('')}</div><div class="meaning"><b>${x[2]}</b> · ${x[3]}</div><div class="note" style="text-align:center">${x[4]}</div><div class="controls"><button class="btn gold" onclick="speak('${x[0]}',.5)">${T().hear}</button></div></div>`).join('')}
let deck=[...W],fi=0;function shuffleA(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderFlash(){flashGrid.innerHTML=deck.map((x,i)=>`<div class="card flash" onclick="this.classList.toggle('revealed')"><div class="prompt"><div class="ar">${x[0]}</div><div class="note">${T().reveal}</div></div><div class="answer"><b>${x[2]}</b><br>${x[3]}<br><button class="btn gold" onclick="event.stopPropagation();speak('${x[0]}',.5)">${T().hear}</button></div></div>`).join('')}
shuffle.onclick=()=>{deck=shuffleA([...W]);renderFlash()};hearCurrent.onclick=()=>speak(deck[fi%deck.length][0],.5);
let qc=0,qt=0,currentQuiz;function makeQuiz(){currentQuiz=S[Math.floor(Math.random()*S.length)];qAr.textContent=currentQuiz[0];feedback.textContent='';let opts=shuffleA([currentQuiz,...S.filter(x=>x[0]!==currentQuiz[0]).slice(0,3)]);choices.innerHTML=opts.map(x=>`<button class="choice" data-a="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(document.querySelector('.choice.correct,.choice.wrong'))return;qt++;if(b.dataset.a===currentQuiz[0]){qc++;b.classList.add('correct');feedback.textContent=T().correct}else{b.classList.add('wrong');feedback.textContent=T().wrong+currentQuiz[1]};score.textContent=qc+' / '+qt})}
qHear.onclick=()=>speak(qAr.textContent,.5);next.onclick=makeQuiz;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.v).classList.add('active')});
alphabet.onclick=()=>speak('ألف باء تاء ثاء جيم حاء خاء دال ذال راء زاي سين شين صاد ضاد طاء ظاء عين غين فاء قاف كاف لام ميم نون هاء واو ياء',.52);voiceHelp.onclick=()=>help.classList.toggle('show');install.onclick=()=>help.classList.toggle('show');enBtn.onclick=()=>{lang='en';applyLang()};amBtn.onclick=()=>{lang='am';applyLang()};
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=checkVoice;setTimeout(checkVoice,250)}if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
applyLang();
</script></body></html>
